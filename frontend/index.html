<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart StockBot AI - Dashboard</title>
    <meta name="description"
        content="AI-powered inventory management dashboard with voice control, demand prediction, and anomaly detection.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #111827;
            --bg-card: #151c2c;
            --bg-sidebar: #0d1321;
            --accent-blue: #3b82f6;
            --accent-cyan: #22d3ee;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-orange: #f59e0b;
            --accent-purple: #8b5cf6;
            --text-primary: #f1f5f9;
            --text-secondary: #64748b;
            --text-dim: #475569;
            --border: rgba(255, 255, 255, 0.06);
            --sidebar-w: 250px;
            --glass: rgba(21, 28, 44, 0.85);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            min-height: 100vh;
        }

        /* ========== SIDEBAR ========== */
        .sidebar {
            width: var(--sidebar-w);
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            z-index: 100;
            padding: 24px 16px;
        }

        .sidebar .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 8px;
            margin-bottom: 8px;
        }

        .sidebar .logo .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            color: white;
        }

        .sidebar .logo-text {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text-primary);
        }

        .sidebar .logo-sub {
            font-size: 0.65rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .nav-section-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-dim);
            padding: 24px 12px 8px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            color: var(--text-secondary);
            text-decoration: none;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s ease;
            margin-bottom: 2px;
            cursor: pointer;
        }

        .nav-link:hover {
            background: rgba(59, 130, 246, 0.08);
            color: var(--text-primary);
        }

        .nav-link.active {
            background: rgba(59, 130, 246, 0.15);
            color: var(--accent-blue);
        }

        .nav-link i {
            width: 20px;
            text-align: center;
            font-size: 0.9rem;
        }

        .user-card {
            margin-top: auto;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
        }

        .user-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.8rem;
        }

        .user-name {
            font-size: 0.8rem;
            font-weight: 600;
        }

        .user-role {
            font-size: 0.65rem;
            color: var(--text-secondary);
        }

        /* ========== MAIN ========== */
        .main {
            margin-left: var(--sidebar-w);
            flex: 1;
            padding: 24px 32px;
            background: var(--bg-primary);
        }

        /* Top Bar */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }

        .topbar h1 {
            font-size: 1.4rem;
            font-weight: 700;
        }

        .topbar-right {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px 16px;
            width: 280px;
        }

        /* more styles omitted for brevity */
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">
            <div class="logo-icon">SB</div>
            <div>
                <div class="logo-text">Smart StockBot</div>
                <div class="logo-sub">Inventory AI</div>
            </div>
        </div>
    </div>
    <div class="main">
        <div class="topbar">
            <h1>Dashboard</h1>
            <div class="topbar-right">
                <div class="search-box">
                    <i class="fa fa-search"></i>
                    <input type="text" placeholder="Search products..." />
                </div>
            </div>
        </div>

        <div class="container">
            <h2>Welcome to Smart StockBot</h2>
            <p>Use the sidebar to navigate the admin panel and inventory system.</p>
        </div>
    </div>
</body>
</html>
